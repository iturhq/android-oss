name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "MAPLIBRE_API_KEY=stub" >> local.properties
          echo "MAPTILER_API_KEY=stub" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=stub" >> local.properties

      - name: Create google-services.json stub
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub",
              "storage_bucket": "stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "cat.itur.app.oss" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": { "package_name": "cat.itur.app.oss.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000002",
                  "android_client_info": { "package_name": "cat.itur.app.oss.local.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Check formatting
        run: ./gradlew -I spotless/spotless.gradle.kts spotlessCheck

      - name: Run static analysis
        run: ./gradlew detekt

      - name: Run unit tests with coverage
        run: ./gradlew :app:testProdDebugUnitTest :core:auth:createLocalDebugUnitTestCoverageReport :core:data-fake:createDebugUnitTestCoverageReport :feature:map:createDebugUnitTestCoverageReport :core:datastore:createDebugUnitTestCoverageReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            core/auth/build/reports/coverage/test/local/debug/report.xml
            core/data-fake/build/reports/coverage/test/debug/report.xml
            feature/map/build/reports/coverage/test/debug/report.xml
            core/datastore/build/reports/coverage/test/debug/report.xml
          fail_ci_if_error: true

      - name: Assemble supported application variants
        run: ./gradlew :app:assembleProdRelease :app:assembleProdDebug :app:assembleLocalDebug

  map-screen-instrumented-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "MAPLIBRE_API_KEY=stub" >> local.properties
          echo "MAPTILER_API_KEY=stub" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=stub" >> local.properties

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run MapScreen tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: >-
            bash -o pipefail -c
            './gradlew :feature:map:connectedDebugAndroidTest
            --console=plain --stacktrace 2>&1 | tee emulator-test.log'

      - name: Mark MapScreen emulator verification
        if: github.event_name == 'push'
        run: |
          short_sha=${GITHUB_SHA:0:7}
          tag="ui-verified-map-screen-${short_sha}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" -m "MapScreen instrumented tests passed on a hosted Android emulator"
          git push origin "$tag"

      - name: Mark MapScreen emulator failure with diagnostics
        if: failure() && github.event_name == 'push'
        run: |
          short_sha=${GITHUB_SHA:0:7}
          tag="ui-failed-map-screen-${short_sha}"
          if test -f emulator-test.log; then
            {
              echo "=== Gradle failure summary ==="
              grep -E \
                'FAILURE:|What went wrong|Execution failed for task|Caused by:|> .*failed|BUILD FAILED' \
                emulator-test.log || true
              echo "=== Android test result XML ==="
              find feature/map/build/outputs/androidTest-results \
                -type f -name '*.xml' -print -exec tail -160 {} \; 2>/dev/null || true
              echo "=== Final Gradle output ==="
              tail -120 emulator-test.log
            } > emulator-test-tail.log
          else
            echo "The emulator action failed before Gradle produced emulator-test.log." \
              > emulator-test-tail.log
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$tag" -F emulator-test-tail.log
          git push origin "$tag"
