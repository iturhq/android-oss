name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "MAPLIBRE_API_KEY=stub" >> local.properties
          echo "MAPTILER_API_KEY=stub" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=stub" >> local.properties

      - name: Create google-services.json stub
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub",
              "storage_bucket": "stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "cat.itur.app.oss" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": { "package_name": "cat.itur.app.oss.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000002",
                  "android_client_info": { "package_name": "cat.itur.app.oss.local.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Check formatting
        run: ./gradlew -I spotless/spotless.gradle.kts spotlessCheck

      - name: Run static analysis
        run: ./gradlew detekt

      - name: Run unit tests with coverage
        run: ./gradlew unitTestCoverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: core/auth/build/reports/coverage/test/local/debug/report.xml,core/data-api/build/reports/coverage/test/debug/report.xml,core/data-firebase/build/reports/coverage/test/debug/report.xml,core/domain/build/reports/coverage/test/debug/report.xml,core/location/build/reports/coverage/test/debug/report.xml,core/model/build/reports/coverage/test/debug/report.xml,core/ui/build/reports/coverage/test/debug/report.xml,feature/map/build/reports/coverage/test/debug/report.xml,core/datastore/build/reports/coverage/test/debug/report.xml
          fail_ci_if_error: true

      - name: Assemble supported application variants
        run: ./gradlew :app:assembleProdRelease :app:assembleProdDebug :app:assembleLocalDebug

  map-screen-instrumented-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "MAPLIBRE_API_KEY=stub" >> local.properties
          echo "MAPTILER_API_KEY=stub" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=stub" >> local.properties

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run MapScreen tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: >-
            bash -o pipefail -c
            './gradlew :feature:map:connectedDebugAndroidTest
            --console=plain --stacktrace 2>&1 | tee emulator-test.log'

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: map-screen-emulator-diagnostics
          path: |
            emulator-test.log
            feature/map/build/outputs/androidTest-results/
            feature/map/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
