ignore:
  # Test infrastructure is exercised by tests but is not shipped as application code.
  - "core/data-fake/**/*"
  # Debug-only activities and Compose tooling previews are not production behaviour.
  - "**/src/debug/**/*"
  # Annotation processors own these sources; handwritten DI modules remain in scope.
  - "**/build/generated/**/*"
  - "**/hilt_aggregated_deps/**/*"
  - "**/*Factory.java"
  - "**/*_MembersInjector.java"
  - "**/Hilt_*.java"
  - "**/*_HiltModules*.java"
  - "**/*_GeneratedInjector.java"

coverage:
  status:
    project:
      default:
        # Fail if overall coverage drops more than 2% below the baseline.
        target: auto
        threshold: 2%
    patch:
      default:
        # New code introduced in a PR must be at least 60% covered.
        target: 60%
        threshold: 5%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
