ignore:
  # Test infrastructure is exercised by tests but is not shipped as application code.
  - "core/data-fake/**/*"
  # Debug-only activities and Compose tooling previews are not production behaviour.
  - "**/src/debug/**/*"
  # Annotation processors own these sources; handwritten DI modules remain in scope.
  - "**/build/generated/**/*"
  - "**/hilt_aggregated_deps/**/*"
  - "**/*Factory.java"
  - "**/*_MembersInjector.java"
  - "**/Hilt_*.java"
  - "**/*_HiltModules*.java"
  - "**/*_GeneratedInjector.java"

coverage:
  status:
    project:
      default:
        # Require the complete, explicit CI upload set to stay at the final gate.
        target: 90%
        threshold: 0%
        if_not_found: failure
    patch:
      default:
        # Keep changed production behaviour at the same no-tolerance standard.
        target: 90%
        threshold: 0%
        if_not_found: failure

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
